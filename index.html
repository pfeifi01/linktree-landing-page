<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>pfeifhofer.dev — Links</title>
<link rel="icon" href="favicon.svg">
<style>
  :root {
    --bg: #0e1116;
    --card: #171c24;
    --card-hover: #1f2631;
    --border: #262d38;
    --text: #e6e9ef;
    --muted: #8b95a5;
    --accent: #5b9dff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8; --card: #ffffff; --card-hover: #f0f3f8;
      --border: #e1e5ea; --text: #1a1f27; --muted: #667080; --accent: #1f6feb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px 64px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 580px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 36px; }
  header h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.2px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  h2 {
    margin: 32px 0 10px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  a.link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; margin-bottom: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    color: inherit; text-decoration: none;
    transition: background .12s ease, border-color .12s ease, transform .12s ease;
  }
  a.link:hover { background: var(--card-hover); border-color: var(--accent); transform: translateY(-1px); }
  a.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon { flex: 0 0 34px; height: 34px; display: grid; place-items: center; font-size: 19px; }
  .body { min-width: 0; flex: 1; }
  .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .desc { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .host { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; opacity: .75; }
  .tag {
    font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted);
  }
  .tag.todo { color: #e5a13a; border-color: #5a4420; }
  .tag.wip { color: #b98cff; border-color: #3f3160; }
  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>pfeifhofer.dev</h1>
    <p>Everything running on the NAS, in one place.</p>
  </header>
  <div id="list"></div>
  <footer>Private index &middot; not indexed by search engines</footer>
</main>

<script>
/* ---------------------------------------------------------------------------
   THE ONLY THING YOU EDIT.
   Add a link: copy a line, change the fields. Push to main to deploy.
     name  – label shown in bold
     url   – full URL
     desc  – one short line
     icon  – any emoji
     tag   – optional: 'todo' (URL unconfirmed) or 'wip'
   The `port` field is documentation only; it is not rendered.
--------------------------------------------------------------------------- */
const GROUPS = [
  {
    title: "Public",
    links: [
      { name: "Personal landing page", url: "https://pfeifhofer.dev", desc: "CV, projects, the page you share with others", icon: "🏠", port: 8080 },
    ],
  },
  {
    title: "Martin’s apps",
    links: [
      { name: "Portfolio Dashboard (demo)", url: "https://portfolio.pfeifhofer.dev", desc: "Anonymized demo build of the finance dashboard", icon: "📊", port: 8082 },
      { name: "Ancestry Visualizer", url: "https://ancestry.pfeifhofer.dev", desc: "Familia Arbor — family tree, pedigree, DNA views", icon: "🌳", port: 8081 },
      { name: "MTG Deck Analyzer", url: "https://mtg.pfeifhofer.dev", desc: "Decks, matchups, deck generator", icon: "🃏", port: 8083 },
      { name: "Sale Season", url: "https://sales.pfeifhofer.dev", desc: "When the sales start across Europe", icon: "🏷️", port: 8086 },
      { name: "Sardinia", url: "https://sardinia.pfeifhofer.dev", desc: "Property, animals and cost tracking", icon: "🐝", port: 8084 },
      { name: "Wardrobe Organizer", url: "https://wardrobe.pfeifhofer.dev", desc: "Clothing inventory and outfits", icon: "👕", port: 8085 },
    ],
  },
  {
    title: "Daniel’s apps",
    links: [
      { name: "UAB", url: "https://uab.pfeifhofer.dev", desc: "Daniel’s project", icon: "🧩", port: 8087 },
    ],
  },
  {
    title: "Daniel’s GitHub Pages",
    links: [
      { name: "CSS Atlas", url: "https://daniel-hopium.github.io/css-atlas/?lang=en#start", desc: "105 CSS properties and selectors with live previews", icon: "🎨" },
      { name: "Fjord Kompass", url: "https://daniel-hopium.github.io/pattern-library/?lang=de", desc: "White-label UI pattern library that explains its own rules (DE)", icon: "🧭" },
      { name: "ARIA Compass", url: "https://daniel-hopium.github.io/aria-compass/?lang=en#start", desc: "ARIA roles and states shown live in the accessibility tree", icon: "♿" },
    ],
  },
  {
    title: "Not live yet",
    links: [
      { name: "Conspiracy Corner Library", url: "#", desc: "Static site in the repo, no container yet", icon: "📚", tag: "wip" },
    ],
  },
];

document.getElementById("list").innerHTML = GROUPS.map(g => `
  <h2>${g.title}</h2>
  ${g.links.map(l => `
    <a class="link" href="${l.url}"${l.url === "#" ? "" : ' target="_blank" rel="noopener"'}>
      <span class="icon">${l.icon}</span>
      <span class="body">
        <span class="name">${l.name}${l.tag ? `<span class="tag ${l.tag}">${l.tag}</span>` : ""}</span>
        <span class="desc">${l.desc}</span>
        ${l.url.startsWith("http") ? `<span class="host">${l.url.replace(/^https?:\/\//, "").replace(/[?#].*$/, "")}</span>` : ""}
      </span>
    </a>`).join("")}
`).join("");
</script>
</body>
</html>
